<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title></title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
<aside class="admin-sidebar">
  <div class="admin-sidebar-header">
    <h1>대화 목록</h1>
    <button id="admin-logout-btn" class="text-btn">로그아웃</button>
  </div>
  <div class="conv-list" id="conversations-list"></div>
</aside>
<section class="admin-chat-area">
  <header class="admin-chat-header">
    <button id="admin-back-btn" aria-label="뒤로">←</button>
    <span class="title" id="admin-chat-header-name">대화를 선택하세요</span>
  </header>
  <main class="chat-main" id="admin-messages">
    <div class="admin-empty" id="admin-empty-msg">왼쪽 목록에서 대화를 선택하세요</div>
  </main>
  <form class="chat-input" id="admin-chat-form">
    <div class="image-preview" id="admin-image-preview" hidden></div>
    <div class="input-row">
      <label class="image-btn" for="admin-image-input" aria-label="사진 첨부">+</label>
      <input type="file" id="admin-image-input" accept="image/*" multiple hidden>
      <input type="text" id="admin-text-input" placeholder="메시지 입력" autocomplete="off">
      <button type="submit" class="send-btn">전송</button>
    </div>
  </form>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
