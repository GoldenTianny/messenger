<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title></title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
<aside class="app-sidebar">
  <div class="app-sidebar-header">
    <h1>대화</h1>
    <div class="sidebar-actions">
      <button id="invite-btn" class="text-btn">+ 초대</button>
      <button id="logout-btn" class="text-btn">로그아웃</button>
    </div>
  </div>
  <div class="conv-list" id="conversations-list"></div>
</aside>

<section class="app-chat-area">
  <header class="chat-header">
    <button id="back-btn" aria-label="뒤로">←</button>
    <span class="title" id="chat-header-name"></span>
  </header>
  <main class="chat-main" id="messages">
    <div class="empty-state" id="empty-state">
      왼쪽 목록에서 대화를 선택하거나<br>
      <strong>+ 초대</strong>로 새 대화를 시작하세요
    </div>
  </main>
  <form class="chat-input" id="chat-form">
    <div class="image-preview" id="image-preview" hidden></div>
    <div class="input-row">
      <label class="image-btn" for="image-input" aria-label="사진 첨부">+</label>
      <input type="file" id="image-input" accept="image/*" multiple hidden>
      <input type="text" id="text-input" placeholder="메시지 입력" autocomplete="off">
      <button type="submit" class="send-btn">전송</button>
    </div>
  </form>
</section>

<div class="modal" id="invite-modal" hidden>
  <div class="modal-backdrop" id="invite-modal-backdrop"></div>
  <div class="modal-content">
    <h2>초대 링크</h2>
    <p>이 링크를 상대방에게 보내세요.<br>7일간 유효합니다.</p>
    <div class="invite-link-box">
      <input type="text" id="invite-link" readonly>
      <button id="copy-invite-btn">복사</button>
    </div>
    <button id="close-invite-modal" class="text-btn modal-close">닫기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
